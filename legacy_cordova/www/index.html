<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Fruit Slice Master 🗡️🍎</title>
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-L4KLPWXQ75"></script>
        <script src="script1.js"></script>
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>

        <div id="score">Score: 0</div>
        <div id="combo">Combo: x1</div>
        <div id="timer"></div>

        </div>
        <audio id="sliceSound" src="sword.mp3" preload="auto"></audio>
        <audio id="goldenSliceSound" src="sword2.mp3" preload="auto"></audio>
        <audio id="diamondSliceSound" src="sword3.mp3" preload="auto"></audio>
        <audio id="powerupSound" src="powerup.mp3" preload="auto"></audio>
